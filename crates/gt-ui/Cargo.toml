[package]
name = "gt-ui"
description = "Slint 组件与各窗口视图"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
gt-core.workspace = true
gt-backend.workspace = true
gt-service.workspace = true
gt-diff.workspace = true
gt-graph.workspace = true
gt-config.workspace = true
crossbeam-channel.workspace = true
slint.workspace = true
tracing.workspace = true
# 剪贴板（FR-LOG-07「复制哈希」）：纯 Rust、无外部进程。
# 不用 `clip.exe` 子进程是因为 UI 线程不允许起进程（架构规划 4.2）。
arboard = { version = "3", default-features = false }

[build-dependencies]
slint-build.workspace = true
