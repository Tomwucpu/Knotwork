# cargo-deny 配置（实施计划任务 0-2）
#
# 首次接入 CI 时请以实际依赖树校准 allow 列表：
#   cargo deny check licenses
#
# 许可基线决策：D1 已确认接受 Slint 的 GPLv3 + 商业 + 免版税三许可模式，
# 因此 allow 列表包含 GPL-3.0-only 与 Slint 的两个自定义许可标识。

[graph]
targets = [
    { triple = "x86_64-pc-windows-msvc" },
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
    "MPL-2.0",
    "BSL-1.0",
    "OpenSSL",
    # Slint（D1 已确认）
    "GPL-3.0-only",
    "LicenseRef-Slint-Royalty-free-2.0",
    "LicenseRef-Slint-Software-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
